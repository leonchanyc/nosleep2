<!DOCTYPE html>
<html>
<head>
    <title>NoSleep.js - Simple Test Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Style for the checkbox container */
        .options-container {
            font-size: 18px; /* Adjust font size as needed */
            margin-bottom: 20px;
        }
        /* Style for the custom checkboxes */
        .options-container input[type="checkbox"] {
            transform: scale(1.5); /* Scale up the checkbox size */
            margin-right: 10px; /* Space between checkbox and label text */
        }
        /* Style for the textarea */
        #userInput {
            font-size: 18px; /* Adjust font size as needed */
            width: 80%; /* Adjust the width as needed */
            height: 100px; /* Adjust the height as needed */
            margin-top: 10px;
            background-color: #ffffff; /* Default background */
            color: #000000; /* Default text color */
        }
        /* Style for placeholder in default state */
        #userInput::placeholder {
            color: #888888; /* Default placeholder color */
        }
        /* Lighter green background color */
        .wakeLockOn {
            background-color: #000000; /* Black color for body */
        }
        .wakeLockOn #userInput {
            background-color: #000000; /* Black background for textarea */
            color: #ffffff; /* White text for textarea */
        }
        .wakeLockOn #userInput::placeholder {
            color: #cccccc; /* Light gray placeholder for visibility */
        }
        .wakeLockOff {
            background-color: #ffffff; /* Default to white for body */
        }
        .wakeLockOff #userInput {
            background-color: #ffffff; /* White background for textarea */
            color: #000000; /* Black text for textarea */
        }
        .wakeLockOff #userInput::placeholder {
            color: #888888; /* Default placeholder color */
        }
    </style>
</head>
<body class="wakeLockOff">
    <div class="options-container">
        <textarea id="userInput" placeholder=""></textarea>
        <br>
        <input type="button" id="toggle" value="No Sleep is disabled" />
        <br><br>
        <input type="button" id="reset" value="Reset All" />
    </div>

    <script src="NoSleep.min.js"></script>
    <script>
        var noSleep = new NoSleep();
        var wakeLockEnabled = false;
        var toggleEl = document.querySelector("#toggle");
        var resetEl = document.querySelector("#reset");
        var bodyEl = document.querySelector("body");
        var userInput = document.querySelector("#userInput");
        var checkboxes = document.querySelectorAll("input[name='updateOption']");

        // Load saved state from localStorage
        function loadState() {
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = localStorage.getItem(checkbox.value) === 'true';
            });
            userInput.value = localStorage.getItem('userInput') || '';
        }

        // Save state to localStorage
        function saveState() {
            checkboxes.forEach(function(checkbox) {
                localStorage.setItem(checkbox.value, checkbox.checked);
            });
            localStorage.setItem('userInput', userInput.value);
        }

        // Reset state
        function resetState() {
            localStorage.clear();
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = false;
            });
            userInput.value = '';
        }

        // Load state on page load
        loadState();

        // Add event listeners to save state on change
        checkboxes.forEach(function(checkbox) {
            checkbox.addEventListener('change', saveState);
        });
        userInput.addEventListener('input', saveState);

        // Handle the Wake Lock button
        toggleEl.addEventListener('click', function() {
            if (!wakeLockEnabled) {
                noSleep.enable(); // keep the screen on!
                wakeLockEnabled = true;
                toggleEl.value = "No Sleep is enabled";
                bodyEl.classList.add("wakeLockOn");
                bodyEl.classList.remove("wakeLockOff");
            } else {
                noSleep.disable(); // let the screen turn off.
                wakeLockEnabled = false;
                toggleEl.value = "No Sleep is disabled";
                bodyEl.classList.add("wakeLockOff");
                bodyEl.classList.remove("wakeLockOn");
            }
        }, false);

        // Handle the Reset button
        resetEl.addEventListener('click', resetState);
    </script>
</body>
</html>
